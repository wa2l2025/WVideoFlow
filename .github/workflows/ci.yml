name: WVideoFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install System FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax Check
      run: |
        python -c "import ast; ast.parse(open('app.py').read()); print('✅ Syntax Valid')"

    - name: Smoke Test Backend Initialization
      run: |
        PORT=7075 python app.py &
        PID=$!
        sleep 3
        curl -s http://localhost:7075/api/transitions | grep -q "fade" && echo "✅ API Test Passed"
        kill $PID
